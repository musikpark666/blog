server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Each public quote list has a content hash in its filename.
  location /quotes-data/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
